<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘 숙제, 뭐부터? - 중3 숙제 순서 플래너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f9fd;--grid:#dce7f4;--ink:#1c2a5c;--sub:#5a6577;--card:#fff;--line:#c9d6e8;--hl:#ffe45c;--hlt:#1c2a5c;--bad:#c93a3a;--ok:#1a7f57;--btn:#1c2a5c;--btnt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10162b;--grid:#1a2444;--ink:#e8edff;--sub:#9aa6c4;--card:#182040;--line:#2c3866;--bad:#ff8a8a;--ok:#6fdcae;--btn:#ffe45c;--btnt:#10162b}}
:root[data-theme="dark"]{--bg:#10162b;--grid:#1a2444;--ink:#e8edff;--sub:#9aa6c4;--card:#182040;--line:#2c3866;--bad:#ff8a8a;--ok:#6fdcae;--btn:#ffe45c;--btnt:#10162b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:16px;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:30px;margin:8px 0 2px;line-height:1.25}
h1 span{background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 4px}
h2{font-size:21px;margin:0 0 4px}
.lead{color:var(--sub);margin:0 0 18px}
.steps{display:flex;gap:6px;margin:0 0 18px;flex-wrap:wrap}
.steps button{flex:1 1 0;min-width:70px;font:inherit;font-size:14px;padding:8px 6px;border:2px solid var(--line);background:var(--card);color:var(--sub);border-radius:10px;cursor:default}
.steps button.done{cursor:pointer;color:var(--ink)}
.steps button.on{border-color:var(--ink);color:var(--ink);background:var(--hl);color:var(--hlt);font-weight:700}
.panel{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:20px 18px;box-shadow:5px 5px 0 var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.row .full{grid-column:1/-1}
label{display:block;font-size:14px;color:var(--sub);margin-bottom:3px}
input,select{width:100%;font:inherit;padding:9px 10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--hl);outline-offset:1px;border-color:var(--ink)}
.btn{font:inherit;font-weight:700;padding:10px 18px;border-radius:10px;border:2px solid var(--ink);background:var(--btn);color:var(--btnt);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:4px 0 0}
.task{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px dashed var(--line)}
.rank{width:34px;height:34px;border-radius:50%;background:var(--hl);color:var(--hlt);display:grid;place-items:center;font-weight:700}
.tname{font-weight:700}
.meta{font-size:13px;color:var(--sub)}
.bar{height:8px;background:var(--grid);border-radius:4px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.score{font-size:20px;font-weight:700;text-align:right}
.x{font:inherit;font-size:13px;background:none;border:none;color:var(--sub);text-decoration:underline;cursor:pointer;padding:0}
.q{margin-bottom:16px}
.q p{margin:0 0 6px;font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{font:inherit;font-size:15px;padding:8px 12px;border:2px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);cursor:pointer}
.opts button[aria-pressed="true"]{background:var(--hl);color:var(--hlt);border-color:var(--ink);font-weight:700}
.type{border:2px dashed var(--ink);border-radius:12px;padding:14px;margin-top:8px}
.type b{font-size:20px;background:linear-gradient(transparent 55%,var(--hl) 55%)}
.type ul{margin:8px 0 0;padding-left:20px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px dashed var(--line);vertical-align:top}
th{font-size:13px;color:var(--sub);font-weight:400}
.wrap{overflow-x:auto}
.first{background:var(--hl);color:var(--hlt);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-weight:700}
.warn{color:var(--bad);font-size:14px;margin:4px 0}
.day{margin-top:16px}
.day h3{margin:0 0 6px;font-size:18px}
.blk{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:8px 10px;border-left:5px solid var(--ink);background:var(--bg);margin-bottom:6px;border-radius:0 8px 8px 0}
.blk.brk{border-left-color:var(--line);color:var(--sub);font-size:14px}
.blk .t{font-variant-numeric:tabular-nums;color:var(--sub);font-size:14px}
.ok{color:var(--ok);font-weight:700}
@media (max-width:520px){.row{grid-template-columns:1fr}h1{font-size:25px}.blk{grid-template-columns:92px 1fr}}
</style>
</head>
<body>
<main>
<h1>오늘 숙제, <span>뭐부터?</span></h1>
<p class="lead">숙제를 적으면 중요한 순서, 내 스타일, 시간표까지 만들어 줘요.</p>
<div class="steps" id="steps"></div>

<section class="panel" id="p1">
  <h2>① 숙제 중요도 평가</h2>
  <p class="lead">숙제를 하나씩 추가하세요. 마감, 성적 반영, 분량, 난이도로 점수를 매겨요.</p>
  <div class="row">
    <div class="full"><label for="name">숙제 이름</label><input id="name" maxlength="40" placeholder="예: 영어 에세이 쓰기"></div>
    <div><label for="due">제출 마감일</label><input id="due" type="date"></div>
    <div><label for="min">걸릴 것 같은 시간 (분)</label><input id="min" type="number" min="5" max="600" step="5" value="30"></div>
    <div><label for="diff">난이도</label>
      <select id="diff"><option value="1">1 - 아주 쉬움</option><option value="2">2 - 쉬움</option><option value="3" selected>3 - 보통</option><option value="4">4 - 어려움</option><option value="5">5 - 매우 어려움</option></select></div>
    <div><label for="grade">성적에 반영돼?</label>
      <select id="grade"><option value="high">크게 반영 (수행평가 등)</option><option value="mid" selected>제출·검사만 함</option><option value="low">반영 안 됨 (복습·자율)</option></select></div>
  </div>
  <div class="btns" style="margin-top:0"><button class="btn" id="add">숙제 추가</button><button class="btn ghost" id="demo">예시로 채워보기</button></div>
  <p class="err" id="err" role="alert"></p>
  <div id="list"></div>
  <div class="btns"><button class="btn" id="to2">다음: 내 스타일 분석</button></div>
</section>

<section class="panel" id="p2" hidden></section>
<section class="panel" id="p3" hidden></section>
<section class="panel" id="p4" hidden></section>
</main>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const base=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const fmt=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const dayLabel=i=>{if(i===0)return '오늘';if(i===1)return '내일';const d=base();d.setDate(d.getDate()+i);return (d.getMonth()+1)+'/'+d.getDate()+' ('+'일월화수목금토'[d.getDay()]+')'};
const dLabel=n=>n<0?'기한 지남':n===0?'오늘 마감':'D-'+n;
const GL={high:'성적 크게 반영',mid:'제출·검사',low:'반영 없음'};
const GP={high:25,mid:14,low:4};

let tasks=[],step=1,maxStep=1;
let style={focus:30,start:1140,order:'hard',speed:1,buffer:1.05,cap:120};
const Q=[
{k:'focus',t:'한 번 앉으면 집중이 몇 분쯤 가?',o:[['20분',20],['30분',30],['45분',45],['60분 이상',60]]},
{k:'start',t:'숙제는 보통 언제 시작해?',o:[['방과 후 바로 (16:30)',990],['저녁 먹고 (19:00)',1140],['늦은 밤 (21:00)',1260]]},
{k:'order',t:'어떤 숙제부터 손이 가?',o:[['어려운 것부터 해치워','hard'],['쉬운 것부터 시동 걸어','easy']]},
{k:'speed',t:'숙제 속도는 친구들에 비해?',o:[['빠른 편',0.85],['비슷해',1],['느린 편',1.2]]},
{k:'buffer',t:'숙제 중에 폰·딴짓을 얼마나 해?',o:[['자주 해',1.15],['가끔',1.05],['거의 안 해',1]]},
{k:'cap',t:'하루에 숙제에 쓸 수 있는 시간은?',o:[['1시간',60],['2시간',120],['3시간',180],['4시간',240]]}
];

function withScore(t){
  const left=Math.round((new Date(t.due+'T00:00')-base())/864e5);
  const urg=left<=0?40:left===1?34:left===2?28:left===3?22:left<7?14:6;
  const s=Math.round((urg+GP[t.grade]+Math.min(15,t.min/8)+t.diff*2)/90*100);
  return {...t,left,score:s};
}
const ranked=()=>tasks.map(withScore).sort((a,b)=>b.score-a.score);

function makePlan(){
  const p=ranked().map(t=>{
    const f=1+(t.diff-3)*0.08;
    return {...t,f,est:Math.max(5,Math.round(t.min*style.speed*style.buffer*f/5)*5)};
  });
  p.sort((a,b)=>{
    const ba=Math.floor(a.score/10),bb=Math.floor(b.score/10);
    if(ba!==bb)return bb-ba;
    if(a.diff!==b.diff)return style.order==='hard'?b.diff-a.diff:a.diff-b.diff;
    return b.score-a.score;
  });
  return p;
}

function makeSchedule(plan){
  const blocks=[];let day=0,clock=style.start,used=0,since=0;
  const brk=style.focus<=30?5:10;
  plan.forEach((p,idx)=>{
    let rem=p.est;p.lastDay=day;p.firstDay=null;
    while(rem>0){
      if(used>=style.cap){day++;clock=style.start;used=0;since=0}
      const c=Math.min(rem,style.focus-since,style.cap-used);
      if(p.firstDay===null)p.firstDay=day;
      blocks.push({day,name:p.name,s:clock,e:clock+c});
      clock+=c;used+=c;since+=c;rem-=c;p.lastDay=day;
      const last=rem===0&&idx===plan.length-1;
      if(since>=style.focus&&used<style.cap&&!last){blocks.push({day,brk:true,s:clock,e:clock+brk});clock+=brk;since=0}
    }
  });
  return blocks;
}

function renderSteps(){
  const n=['① 중요도','② 내 스타일','③ 순서·시간','④ 계획표'];
  $('#steps').innerHTML=n.map((t,i)=>`<button data-s="${i+1}" class="${step===i+1?'on':i+1<step?'done':''}" ${i+1<step?'':'tabindex="-1"'}>${t}</button>`).join('');
  document.querySelectorAll('#steps button.done').forEach(b=>b.onclick=()=>go(+b.dataset.s));
}

function go(n){
  step=n;maxStep=Math.max(maxStep,n);
  for(let i=1;i<=4;i++)$('#p'+i).hidden=i!==n;
  if(n===2)renderStyle();if(n===3)renderPlan();if(n===4)renderResult();
  renderSteps();window.scrollTo({top:0});
}

function renderList(){
  const r=ranked();
  $('#list').innerHTML=r.length?r.map((t,i)=>`<div class="task"><div class="rank">${i+1}</div><div><div class="tname">${esc(t.name)}</div><div class="meta">${dLabel(t.left)} · ${GL[t.grade]} · 약 ${t.min}분 · 난이도 ${t.diff}</div><div class="bar"><i style="width:${t.score}%"></i></div></div><div><div class="score">${t.score}점</div><button class="x" data-id="${t.id}">삭제</button></div></div>`).join(''):'<p class="meta">아직 추가한 숙제가 없어요.</p>';
  document.querySelectorAll('#list .x').forEach(b=>b.onclick=()=>{tasks=tasks.filter(t=>t.id!==+b.dataset.id);renderList()});
}

function addTask(){
  const name=$('#name').value.trim(),due=$('#due').value,min=+$('#min').value;
  if(!name){$('#err').textContent='숙제 이름을 적어 주세요.';return}
  if(!due){$('#err').textContent='제출 마감일을 골라 주세요.';return}
  if(!(min>=5)){$('#err').textContent='걸리는 시간은 5분 이상으로 적어 주세요.';return}
  tasks.push({id:Date.now()+Math.random(),name,due,min,diff:+$('#diff').value,grade:$('#grade').value});
  $('#err').textContent='';$('#name').value='';renderList();$('#name').focus();
}
const iso=n=>{const d=base();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function demo(){
  const s=[['수학 문제집 3단원',3,60,3,'mid'],['영어 수행평가 에세이',2,90,4,'high'],['과학 실험 보고서',5,60,4,'high'],['국어 독서록 쓰기',1,30,2,'mid'],['한국사 복습 정리',6,40,2,'low']];
  tasks=s.map((x,i)=>({id:Date.now()+i,name:x[0],due:iso(x[1]),min:x[2],diff:x[3],grade:x[4]}));renderList();
}

function renderStyle(){
  const q=Q.map(x=>`<div class="q"><p>${x.t}</p><div class="opts">${x.o.map(o=>`<button data-k="${x.k}" data-v="${o[1]}" aria-pressed="${String(style[x.k])===String(o[1])}">${o[0]}</button>`).join('')}</div></div>`).join('');
  $('#p2').innerHTML=`<h2>② 나의 숙제 스타일 분석</h2><p class="lead">여섯 가지만 골라 주세요. 골라 둔 것은 기본값이에요.</p>${q}<div id="type"></div><div class="btns"><button class="btn ghost" id="b1">이전</button><button class="btn" id="b3">다음: 순서와 시간 정하기</button></div>`;
  document.querySelectorAll('#p2 .opts button').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;style[k]=isNaN(+b.dataset.v)?b.dataset.v:+b.dataset.v;
    b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));showType();
  });
  $('#b1').onclick=()=>go(1);$('#b3').onclick=()=>go(3);showType();
}
function showType(){
  const name=(style.focus<=30?'짧게 끊어 하는 ':'오래 파고드는 ')+(style.order==='hard'?'도전형':'시동형');
  const tips=[
    style.order==='hard'?'머리가 맑은 처음에 가장 어려운 숙제를 두어요.':'쉬운 숙제로 리듬을 탄 뒤 어려운 숙제로 넘어가요.',
    `${style.focus}분 집중하고 ${style.focus<=30?5:10}분 쉬는 리듬으로 짜요.`,
    style.buffer>1.1?'딴짓 시간을 15% 더 잡았어요. 폰은 다른 방에 두면 좋아요.':style.buffer>1?'딴짓 여유를 5% 더 잡았어요.':'딴짓 여유 없이 딱 맞게 잡아요.',
    style.speed<1?'빠른 편이라 예상 시간을 15% 줄여요.':style.speed>1?'천천히 하는 편이라 예상 시간을 20% 늘려요.':'예상 시간은 그대로 써요.'
  ];
  $('#type').innerHTML=`<div class="type"><b>${name}</b><ul>${tips.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
}

function renderPlan(){
  const p=makePlan();
  $('#p3').innerHTML=`<h2>③ 하는 순서와 걸리는 시간</h2><p class="lead">점수가 비슷하면 내 스타일(${style.order==='hard'?'어려운 것부터':'쉬운 것부터'})에 맞춰 정했어요.</p><div class="wrap"><table><thead><tr><th>순서</th><th>숙제</th><th>내 예상</th><th>예측 시간</th></tr></thead><tbody>${p.map((t,i)=>`<tr><td><span class="rank">${i+1}</span></td><td><b>${esc(t.name)}</b><div class="meta">${dLabel(t.left)} · ${t.score}점</div></td><td>${t.min}분</td><td><b>${t.est}분</b><div class="meta">속도 ×${style.speed} · 딴짓 ×${style.buffer} · 난이도 ×${t.f.toFixed(2)}</div></td></tr>`).join('')}</tbody></table></div><div class="btns"><button class="btn ghost" id="b2">이전</button><button class="btn" id="b4">계획표 만들기</button></div>`;
  $('#b2').onclick=()=>go(2);$('#b4').onclick=()=>go(4);
}

function renderResult(){
  const plan=makePlan(),blocks=makeSchedule(plan);
  const total=plan.reduce((a,t)=>a+t.est,0),days=blocks[blocks.length-1].day+1;
  const warns=plan.filter(t=>t.left>=0&&t.lastDay>t.left).map(t=>`<div class="warn">⚠ '${esc(t.name)}'은 마감(${dLabel(t.left)})보다 늦게 끝나요. 하루 시간을 늘리거나 일찍 시작해요.</div>`).join('');
  const over=plan.filter(t=>t.left<0).map(t=>`<div class="warn">⚠ '${esc(t.name)}'은 이미 기한이 지났어요. 선생님께 말씀드리고 먼저 하세요.</div>`).join('');
  const f=plan[0];
  let html=`<h2>④ 나의 숙제 계획표</h2><div class="first">오늘 가장 먼저 할 숙제: ${esc(f.name)} (${f.est}분)</div><p>총 <b>${Math.floor(total/60)}시간 ${total%60}분</b>, <b>${days}일</b>에 나눠서 하면 돼요. 하루 ${style.cap/60}시간, ${fmt(style.start)}에 시작해요.</p>${warns||over||'<div class="ok">✔ 모든 숙제가 마감 전에 끝나요.</div>'}${warns&&over?over:''}`;
  for(let d=0;d<days;d++){
    html+=`<div class="day"><h3>${dayLabel(d)}</h3>`+blocks.filter(b=>b.day===d).map(b=>b.brk?`<div class="blk brk"><span class="t">${fmt(b.s)}–${fmt(b.e)}</span><span>쉬는 시간</span></div>`:`<div class="blk"><span class="t">${fmt(b.s)}–${fmt(b.e)}</span><span><b>${esc(b.name)}</b> · ${b.e-b.s}분</span></div>`).join('')+'</div>';
  }
  html+='<div class="btns"><button class="btn ghost" id="b3b">이전</button><button class="btn" id="again">처음부터 다시</button></div>';
  $('#p4').innerHTML=html;
  $('#b3b').onclick=()=>go(3);$('#again').onclick=()=>{tasks=[];renderList();maxStep=1;go(1)};
}

$('#add').onclick=addTask;$('#demo').onclick=demo;
$('#name').addEventListener('keydown',e=>{if(e.key==='Enter')addTask()});
$('#to2').onclick=()=>{if(!tasks.length){$('#err').textContent='숙제를 하나 이상 추가해 주세요.';return}$('#err').textContent='';go(2)};
$('#due').value=iso(2);
renderList();renderSteps();
</script>
</body>
</html>
